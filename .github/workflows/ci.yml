name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore ProyectoFinal.sln

      - name: Compilar
        run: dotnet build ProyectoFinal.sln --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test ProyectoFinal.sln --no-build --configuration Release --verbosity normal
